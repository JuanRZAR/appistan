name: Publish AppIstan to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      APPISTAN_PAGES: 'true'
      APPISTAN_RELEASE_DIR: ${{ github.workspace }}/.tools/pages-release
      APPISTAN_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/latest/download/AppIstan-latest.apk
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Obtain the latest published APK and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern 'release.json' --pattern 'AppIstan-*.apk' --dir "$APPISTAN_RELEASE_DIR"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the static site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
